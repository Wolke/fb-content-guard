name: Test and package
on:
  push:
    branches: [main]
  pull_request:
env:
  WRANGLER_SEND_METRICS: "false"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Test server and background logic (mock API)
        run: npm test
      - name: Verify compiled Workers runtime and D1
        run: npm run test:runtime
      - name: Validate and build development-only extension ZIP
        run: npm run package:dev
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-development
          path: dist/*.zip
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Verify production queues and content handling on synthetic pages
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-preview
          path: test-results/*.png
