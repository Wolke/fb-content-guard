name: Test and package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test server and background logic (mock API)
        run: npm test
      - name: Validate and build extension ZIP
        run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: dist/*.zip
