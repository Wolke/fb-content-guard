name: Test and package
on:
  push:
    branches: [main]
  pull_request:
env:
  WRANGLER_SEND_METRICS: "false"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Test server and background logic (mock API)
        run: npm test
      - name: Verify compiled Workers runtime and D1
        run: npm run test:runtime
      - name: Validate and build development-only extension ZIP
        run: npm run package:dev
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension-development
          path: dist/*.zip
